name: Build CPS (CajitaPaaS) Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Checkout repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 3. Configurar Android SDK y Gradle 8.9 (Compatible con AGP 8.5)
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          curl -fSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9.zip
          unzip -q /tmp/gradle-8.9.zip -d /tmp/gradle-dist
          echo "/tmp/gradle-dist/gradle-8.9/bin" >> $GITHUB_PATH

      - name: 4. Empaquetar Panel Web CPS, Cloudflared y Motor Real MariaDB Alpine (ARM64)
        run: |
          set -e
          mkdir -p android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/scripts
          mkdir -p android/app/src/main/jniLibs/arm64-v8a

          # Copiar el Panel Web (index.html, app.js, logo CPS) a los assets de la APK
          cp -r control-plane/public/* android/app/src/main/assets/public/
          cp -r scripts/* android/app/src/main/assets/scripts/

          # Descargar binarios estáticos ARM64 oficiales (Cloudflared)
          curl -fSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm64 \
            -o android/app/src/main/jniLibs/arm64-v8a/libcloudflared.so
          # En Android no existe /etc/resolv.conf ni demonio DNS en 127.0.0.1:53.
          # Parcheamos el fallback DNS de Go ("127.0.0.1:53", 12 bytes) a Cloudflare DNS ("1.1.1.1:0053", 12 bytes)
          python3 -c "p='android/app/src/main/jniLibs/arm64-v8a/libcloudflared.so'; d=open(p,'rb').read(); open(p,'wb').write(d.replace(b'127.0.0.1:53',b'1.1.1.1:0053'))"
          chmod 755 android/app/src/main/jniLibs/arm64-v8a/libcloudflared.so

          # Habilitar soporte multi-arquitectura ARM64 (QEMU) para empaquetar mariadb:alpine real
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

          # Extraer e inicializar MariaDB Alpine ARM64 oficial (mariadbd + mariadb client + InnoDB datadir)
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/workspace" \
            alpine:3.20 sh -ex -c '
              apk add --no-cache mariadb mariadb-client mariadb-common patchelf zip

              JNI_DIR="/workspace/android/app/src/main/jniLibs/arm64-v8a"
              ASSETS_DIR="/workspace/android/app/src/main/assets"
              STAGE_DIR="/tmp/mariadb_stage"
              mkdir -p "$STAGE_DIR/lib" "$STAGE_DIR/data" "$STAGE_DIR/share" "$STAGE_DIR/tmp"

              cp -L /lib/ld-musl-aarch64.so.1 "$STAGE_DIR/lib/libalpine_musl.so"
              cp -L /usr/bin/mariadbd "$STAGE_DIR/lib/libmariadbd.so"
              cp -L /usr/bin/mariadb "$STAGE_DIR/lib/libmariadb_cli.so"
              chmod 755 "$STAGE_DIR/lib/libalpine_musl.so" "$STAGE_DIR/lib/libmariadbd.so" "$STAGE_DIR/lib/libmariadb_cli.so"

              ldd /usr/bin/mariadbd /usr/bin/mariadb | awk "/=> \/.*\(0x/{print \$1 \"|\" \$3}" | sort -u > "$STAGE_DIR/raw_libs.txt"
              while IFS="|" read -r old_so libpath; do
                [ -z "$old_so" ] && continue
                case "$old_so" in
                  ld-musl*|libc.musl*) continue ;;
                esac
                stem=$(echo "$old_so" | sed -E "s/\.so(\.[0-9]+)*$//")
                clean_stem=$(echo "${stem#lib}" | tr -c "a-zA-Z0-9_" "_")
                new_so="libalpine_${clean_stem}.so"
                cp -L "$libpath" "$STAGE_DIR/lib/$new_so"
                chmod 755 "$STAGE_DIR/lib/$new_so"
                patchelf --set-soname "$new_so" "$STAGE_DIR/lib/$new_so"
                echo "$old_so|$new_so" >> "$STAGE_DIR/soname_map.txt"
              done < "$STAGE_DIR/raw_libs.txt"

              for elf in "$STAGE_DIR/lib/"*.so; do
                [ "$(basename "$elf")" = "libalpine_musl.so" ] && continue
                while IFS="|" read -r old_so new_so; do
                  [ -z "$old_so" ] && continue
                  patchelf --replace-needed "$old_so" "$new_so" "$elf" || true
                done < "$STAGE_DIR/soname_map.txt"
              done

              for elf in "$STAGE_DIR/lib/"*.so; do
                [ "$(basename "$elf")" = "libalpine_musl.so" ] && continue
                for needed in $(patchelf --print-needed "$elf"); do
                  case "$needed" in
                    ld-musl*|libc.musl*) continue ;;
                  esac
                  if [ ! -f "$STAGE_DIR/lib/$needed" ]; then
                    echo "ERROR: Librería faltante $needed en $elf"
                    exit 1
                  fi
                done
              done

              cp -r /usr/share/mariadb/charsets "$STAGE_DIR/share/"
              cp -r /usr/share/mariadb/english "$STAGE_DIR/share/"
              [ -d /usr/share/mariadb/spanish ] && cp -r /usr/share/mariadb/spanish "$STAGE_DIR/share/" || true

              cat <<CNF_EOF > "$STAGE_DIR/my.cnf"
          [mysqld]
          datadir=$STAGE_DIR/data
          lc-messages-dir=$STAGE_DIR/share
          character-sets-dir=$STAGE_DIR/share/charsets
          tmpdir=$STAGE_DIR/tmp
          socket=$STAGE_DIR/tmp/mysql.sock
          pid-file=$STAGE_DIR/tmp/mariadbd.pid
          port=13307
          bind-address=127.0.0.1
          skip-networking=0
          skip-name-resolve
          innodb-data-file-path=ibdata1:12M:autoextend
          innodb-log-file-size=8M
          innodb-buffer-pool-size=32M
          innodb-use-native-aio=0
          innodb-flush-method=fsync
          performance-schema=OFF
          character-set-server=utf8mb4
          collation-server=utf8mb4_general_ci
          default-storage-engine=InnoDB
          CNF_EOF

              mariadb-install-db \
                --defaults-file="$STAGE_DIR/my.cnf" \
                --user=root \
                --basedir=/usr \
                --datadir="$STAGE_DIR/data" \
                --auth-root-authentication-method=normal \
                --skip-test-db

              "$STAGE_DIR/lib/libalpine_musl.so" --library-path "$STAGE_DIR/lib" "$STAGE_DIR/lib/libmariadbd.so" --version
              "$STAGE_DIR/lib/libalpine_musl.so" --library-path "$STAGE_DIR/lib" "$STAGE_DIR/lib/libmariadb_cli.so" --version

              "$STAGE_DIR/lib/libalpine_musl.so" --library-path "$STAGE_DIR/lib" "$STAGE_DIR/lib/libmariadbd.so" \
                --defaults-file="$STAGE_DIR/my.cnf" \
                --user=root &
              MDB_PID=$!

              for i in $(seq 1 30); do
                if [ -S "$STAGE_DIR/tmp/mysql.sock" ]; then
                  break
                fi
                sleep 1
              done

              "$STAGE_DIR/lib/libalpine_musl.so" --library-path "$STAGE_DIR/lib" "$STAGE_DIR/lib/libmariadb_cli.so" \
                --no-defaults \
                --socket="$STAGE_DIR/tmp/mysql.sock" \
                -u root <<SQL_EOF
          DROP USER IF EXISTS ""@"localhost";
          CREATE DATABASE IF NOT EXISTS \`cajitapaas\` CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
          CREATE TABLE IF NOT EXISTS \`cajitapaas\`.\`deployments_audit\` (
            \`id\` INT AUTO_INCREMENT PRIMARY KEY,
            \`app_name\` VARCHAR(128) NOT NULL,
            \`active_color\` VARCHAR(32) NOT NULL,
            \`active_port\` INT NOT NULL,
            \`deployed_at\` TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          CREATE TABLE IF NOT EXISTS \`cajitapaas\`.\`info_sistema\` (
            \`id\` INT AUTO_INCREMENT PRIMARY KEY,
            \`clave\` VARCHAR(128) NOT NULL,
            \`valor\` TEXT NOT NULL,
            \`creado_en\` TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          INSERT INTO \`cajitapaas\`.\`info_sistema\` (\`clave\`, \`valor\`) VALUES ("motor", "MariaDB Alpine ARM64 Oficial (InnoDB)");

          ALTER USER "root"@"localhost" IDENTIFIED VIA mysql_native_password USING PASSWORD("cajitapaas2026");
          CREATE USER IF NOT EXISTS "root"@"127.0.0.1" IDENTIFIED VIA mysql_native_password USING PASSWORD("cajitapaas2026");
          ALTER USER "root"@"127.0.0.1" IDENTIFIED VIA mysql_native_password USING PASSWORD("cajitapaas2026");
          GRANT ALL PRIVILEGES ON *.* TO "root"@"127.0.0.1" WITH GRANT OPTION;
          CREATE USER IF NOT EXISTS "root"@"%" IDENTIFIED VIA mysql_native_password USING PASSWORD("cajitapaas2026");
          ALTER USER "root"@"%" IDENTIFIED VIA mysql_native_password USING PASSWORD("cajitapaas2026");
          GRANT ALL PRIVILEGES ON *.* TO "root"@"%" WITH GRANT OPTION;

          CREATE USER IF NOT EXISTS "cajita_admin"@"%" IDENTIFIED VIA mysql_native_password USING PASSWORD("cajitapaas2026");
          ALTER USER "cajita_admin"@"%" IDENTIFIED VIA mysql_native_password USING PASSWORD("cajitapaas2026");
          GRANT ALL PRIVILEGES ON *.* TO "cajita_admin"@"%" WITH GRANT OPTION;
          CREATE USER IF NOT EXISTS "cajita_admin"@"127.0.0.1" IDENTIFIED VIA mysql_native_password USING PASSWORD("cajitapaas2026");
          ALTER USER "cajita_admin"@"127.0.0.1" IDENTIFIED VIA mysql_native_password USING PASSWORD("cajitapaas2026");
          GRANT ALL PRIVILEGES ON *.* TO "cajita_admin"@"127.0.0.1" WITH GRANT OPTION;
          CREATE USER IF NOT EXISTS "cajita_admin"@"localhost" IDENTIFIED VIA mysql_native_password USING PASSWORD("cajitapaas2026");
          ALTER USER "cajita_admin"@"localhost" IDENTIFIED VIA mysql_native_password USING PASSWORD("cajitapaas2026");
          GRANT ALL PRIVILEGES ON *.* TO "cajita_admin"@"localhost" WITH GRANT OPTION;

          FLUSH PRIVILEGES;
          SQL_EOF

              # Verificar conexión TCP real como cajita_admin antes de empaquetar
              "$STAGE_DIR/lib/libalpine_musl.so" --library-path "$STAGE_DIR/lib" "$STAGE_DIR/lib/libmariadb_cli.so" \
                --no-defaults \
                --protocol=TCP -h 127.0.0.1 -P 13307 -u cajita_admin -pcajitapaas2026 \
                -e "SHOW DATABASES; SELECT * FROM cajitapaas.info_sistema;"

              "$STAGE_DIR/lib/libalpine_musl.so" --library-path "$STAGE_DIR/lib" "$STAGE_DIR/lib/libmariadb_cli.so" \
                --no-defaults \
                --protocol=TCP -h 127.0.0.1 -P 13307 -u root -pcajitapaas2026 \
                -e "SHUTDOWN;"

              wait "$MDB_PID" || true
              rm -rf "$STAGE_DIR/tmp"/* "$STAGE_DIR/data/"*.pid "$STAGE_DIR/data/"*.err

              cd "$STAGE_DIR"
              zip -r -9 "$ASSETS_DIR/mariadb_alpine_bundle.zip" data share

              cp -f "$STAGE_DIR/lib/"*.so "$JNI_DIR/"
              ls -lh "$JNI_DIR/"
              ls -lh "$ASSETS_DIR/mariadb_alpine_bundle.zip"
            '

      - name: 5. Compilar APK (CajitaPaaS ARM64)
        working-directory: ./android
        run: |
          set -o pipefail
          /tmp/gradle-dist/gradle-8.9/bin/gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/gradle_build.log || {
            echo "::error title=Gradle Build Failed::Error durante la compilación en Gradle"
            grep -E "(e: |error:|FAILURE:|Exception)" /tmp/gradle_build.log | tail -n 20 | while IFS= read -r l; do
              [ -n "$l" ] && echo "::error title=Compiler::$l"
            done
            tail -n 25 /tmp/gradle_build.log | while IFS= read -r l; do
              [ -n "$l" ] && echo "::error title=Tail::$l"
            done
            echo "## ❌ Error de Compilación en Gradle" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/gradle_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

          echo "## ✅ Compilación en Gradle Exitosa" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          find app/build/outputs/apk -type f -name "*.apk" | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 6. Publicar APK lista para descargar e instalar en el celular
        uses: actions/upload-artifact@v4
        with:
          name: CajitaPaaS-CPS-ARM64-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 7. Publicar enlace de descarga directa (.apk) en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error title=APK Not Found::No se encontró el archivo APK compilado en android/app/build/outputs/apk/debug"
            exit 1
          fi
          echo "Encontrado APK para release: $APK_PATH"
          cp "$APK_PATH" CajitaPaaS-CPS-ARM64.apk

          # Eliminar releases previos para mantener limpio el repositorio y evitar caché del mismo tag
          for old_tag in $(gh release list --limit 20 --json tagName -q '.[].tagName'); do
            gh release delete "$old_tag" --yes --cleanup-tag 2>/dev/null || true
          done

          NEW_TAG="v1.0.${{ github.run_number }}"
          gh release create "$NEW_TAG" CajitaPaaS-CPS-ARM64.apk \
            --target "${{ github.sha }}" \
            --title "CPS (CajitaPaaS) Android APK — Build #${{ github.run_number }}" \
            --notes "Instalador oficial APK de CPS (CajitaPaaS) compilado automáticamente desde el commit ${{ github.sha }}." \
            --latest
