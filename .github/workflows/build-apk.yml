name: Build CPS (CajitaPaaS) Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Checkout repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 3. Configurar Android SDK y Gradle 8.9 (Compatible con AGP 8.5)
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          curl -fSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9.zip
          unzip -q /tmp/gradle-8.9.zip -d /tmp/gradle-dist
          echo "/tmp/gradle-dist/gradle-8.9/bin" >> $GITHUB_PATH

      - name: 4. Empaquetar Panel Web CPS y Binarios ARM64 dentro de la APK
        run: |
          mkdir -p android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/scripts
          mkdir -p android/app/src/main/jniLibs/arm64-v8a

          # Copiar el Panel Web (index.html, app.js, logo CPS) a los assets de la APK
          cp -r control-plane/public/* android/app/src/main/assets/public/
          cp -r scripts/* android/app/src/main/assets/scripts/

          # Descargar binarios estáticos ARM64 oficiales (Cloudflared)
          curl -fSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm64 \
            -o android/app/src/main/jniLibs/arm64-v8a/libcloudflared.so
          # En Android no existe /etc/resolv.conf ni demonio DNS en 127.0.0.1:53.
          # Parcheamos el fallback DNS de Go ("127.0.0.1:53", 12 bytes) a Cloudflare DNS ("1.1.1.1:0053", 12 bytes)
          python3 -c "p='android/app/src/main/jniLibs/arm64-v8a/libcloudflared.so'; d=open(p,'rb').read(); open(p,'wb').write(d.replace(b'127.0.0.1:53',b'1.1.1.1:0053'))"
          chmod 755 android/app/src/main/jniLibs/arm64-v8a/libcloudflared.so

      - name: 5. Compilar APK (CajitaPaaS ARM64)
        working-directory: ./android
        run: |
          set -o pipefail
          /tmp/gradle-dist/gradle-8.9/bin/gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/gradle_build.log || {
            echo "::error title=Gradle Build Failed::Error durante la compilación en Gradle"
            echo "## ❌ Error de Compilación en Gradle" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "e: |error:|FAILED|FAILURE:|Exception" /tmp/gradle_build.log | tail -n 50 >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/gradle_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

          echo "## ✅ Compilación en Gradle Exitosa" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          find app/build/outputs/apk -type f -name "*.apk" | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 6. Publicar APK lista para descargar e instalar en el celular
        uses: actions/upload-artifact@v4
        with:
          name: CajitaPaaS-CPS-ARM64-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 7. Publicar enlace de descarga directa (.apk) en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error title=APK Not Found::No se encontró el archivo APK compilado en android/app/build/outputs/apk/debug"
            exit 1
          fi
          echo "Encontrado APK para release: $APK_PATH"
          cp "$APK_PATH" CajitaPaaS-CPS-ARM64.apk

          # Eliminar releases previos para mantener limpio el repositorio y evitar caché del mismo tag
          for old_tag in $(gh release list --limit 20 --json tagName -q '.[].tagName'); do
            gh release delete "$old_tag" --yes --cleanup-tag 2>/dev/null || true
          done

          NEW_TAG="v1.0.${{ github.run_number }}"
          gh release create "$NEW_TAG" CajitaPaaS-CPS-ARM64.apk \
            --target "${{ github.sha }}" \
            --title "CPS (CajitaPaaS) Android APK — Build #${{ github.run_number }}" \
            --notes "Instalador oficial APK de CPS (CajitaPaaS) compilado automáticamente desde el commit ${{ github.sha }}." \
            --latest
